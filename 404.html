<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
<script>
  /* theme-init v1.9（全站统一）：统一 localStorage 键 'theme'；旧键 'site_theme' 自动迁移回写；
     无记录时跟随系统 prefers-color-scheme；头部提前执行，避免首屏闪白 */
  (function(){
    var t = null;
    try {
      t = localStorage.getItem('theme');
      if (!t) {
        var legacy = localStorage.getItem('site_theme');
        if (legacy) { t = legacy; localStorage.setItem('theme', legacy); }
      }
    } catch (e) {}
    if (!t) {
      t = (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
    }
    var root = document.documentElement;
    root.setAttribute('data-theme', t);
    root.style.colorScheme = t;
    function syncMeta() {
      var m = document.querySelector('meta[name="theme-color"]');
      if (m) m.setAttribute('content', t === 'dark' ? '#0B1220' : '#FFFFFF');
    }
    syncMeta();
    document.addEventListener('DOMContentLoaded', syncMeta);
  })();
</script>
